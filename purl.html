<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Open Link - Zonqr Tools</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .ad-banner-container { margin-bottom: 25px; width: 100%; max-width: 728px; display: flex; justify-content: center; }
    
    .redirect-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 500px;
    }

    h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; }
    .instruction-text { color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; }
    
    .loader-container { display: none; margin-bottom: 20px; }
    .loader { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #a855f7; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .search-box { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; outline: none; font-weight: 600; margin-bottom: 20px; }
    
    .btn-primary { background: linear-gradient(135deg, #a855f7, #06b6d4); color: white; border: none; padding: 14px 20px; font-size: 1.1rem; font-weight: 800; border-radius: 12px; width: 100%; cursor: pointer; }
    
    .action-buttons { display: none; gap: 12px; margin-top: 20px; }
    .btn-secondary { flex: 1; background: #1e293b; color: white; border: 1px solid #334155; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 600; }
    .btn-open { background: linear-gradient(135deg, #10b981, #059669); border: none; }
    
    /* 300x250 Ad Position */
    .ad-300-container { margin-top: 25px; display: flex; justify-content: center; }
    
    .error-container { display: none; }
    .hidden { display: none !important; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="ad-banner-container">
    <script>atOptions = {'key' : '0e4afde268c78b1f86ee5ef28a491a59', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {}};</script>
    <script src="https://balancedsuppercreed.com/0e4afde268c78b1f86ee5ef28a491a59/invoke.js"></script>
  </div>

  <div class="redirect-box" id="mainBox">
    <h2 id="pageTitle">🌐 Get Your Link</h2>
    <p id="instructionText" class="instruction-text">Enter your Short Code below to fetch the original URL.</p>

    <div id="loaderContainer" class="loader-container">
      <div class="loader"></div>
      <div class="status-text" id="statusMessage">Searching Database...</div>
    </div>

    <input type="text" id="urlInputBox" class="search-box" placeholder="e.g. aB3xQ9" autocomplete="off">
    <button id="searchBtn" class="btn-primary">🔍 Search Link</button>

    <div id="actionButtons" class="action-buttons">
      <button id="copyBtn" class="btn-secondary">📋 Copy</button>
      <button id="openBtn" class="btn-secondary btn-open">🌐 Open Link</button>
    </div>

    <!-- 300x250 Banner added here -->
    <div id="ad300" class="ad-300-container" style="display: none;">
      <script>atOptions = {'key' : '369d1a61b64dd3dec39f12e9944c804d', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {}};</script>
      <script src="https://balancedsuppercreed.com/369d1a61b64dd3dec39f12e9944c804d/invoke.js"></script>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDvfmi1IB--svbmXitMHRMyrvnIPA28DW4", authDomain: "zonqr-db.firebaseapp.com", projectId: "zonqr-db", storageBucket: "zonqr-db.firebasestorage.app", messagingSenderId: "1038668023878", appId: "1:1038668023878:web:63c2af52ab655871c8a247", measurementId: "G-PRMV84KLX7" };
    const db = getFirestore(initializeApp(firebaseConfig));

    const urlInputBox = document.getElementById("urlInputBox");
    const searchBtn = document.getElementById("searchBtn");
    const actionButtons = document.getElementById("actionButtons");
    const copyBtn = document.getElementById("copyBtn");
    const loaderContainer = document.getElementById("loaderContainer");
    const pageTitle = document.getElementById("pageTitle");
    let finalOriginalUrl = "";

    searchBtn.addEventListener("click", async () => {
      let docID = urlInputBox.value.trim();
      if (!docID) return alert("Enter code!");
      
      searchBtn.classList.add("hidden");
      loaderContainer.style.display = "block";
      
      const docSnap = await getDoc(doc(db, "urls", docID));
      if (docSnap.exists()) {
        finalOriginalUrl = docSnap.data().originalUrl;
        loaderContainer.style.display = "none";
        pageTitle.innerText = "✅ Link Found!";
        urlInputBox.value = finalOriginalUrl;
        actionButtons.style.display = "flex";
        document.getElementById("ad300").style.display = "flex"; // Show banner
      }
    });

    copyBtn.addEventListener("click", () => {
      // Trigger Popunder Ad on click
      const script = document.createElement('script');
      script.src = "https://balancedsuppercreed.com/b8/64/4b/b8644b412f45eef45c93c96a9b98c169.js";
      document.body.appendChild(script);

      navigator.clipboard.writeText(finalOriginalUrl).then(() => {
        copyBtn.innerText = "✅ Copied!";
        setTimeout(() => { copyBtn.innerText = "📋 Copy"; }, 2000);
      });
    });

    document.getElementById("openBtn").addEventListener("click", () => window.location.href = finalOriginalUrl);
  </script>

  <script src="https://balancedsuppercreed.com/14/bd/d9/14bdd96cc0568c80149e6ad07d83178a.js"></script>
</body>
</html>
