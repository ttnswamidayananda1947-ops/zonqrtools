<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>Open Link - Zonqr Tools</title>

  <style>
    /* உங்களோட அதே CSS ஸ்டைல்ஸ் இங்கே */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a, #020617); color: white; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .redirect-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(168, 85, 247, 0.2); width: 100%; max-width: 500px; }
    h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; }
    .instruction-text { color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; }
    .loader-container { display: none; margin-bottom: 20px; }
    .loader { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #a855f7; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 10px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .search-box { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; text-align: center; outline: none; margin-bottom: 20px; }
    .btn-primary { background: linear-gradient(135deg, #a855f7, #06b6d4); color: white; border: none; padding: 14px 20px; font-weight: 800; border-radius: 12px; width: 100%; cursor: pointer; }
    .action-buttons { display: none; gap: 12px; margin-top: 20px; }
    .btn-secondary { flex: 1; background: #1e293b; color: white; border: 1px solid #334155; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 600; }
    .btn-open { background: linear-gradient(135deg, #10b981, #059669); border: none; }
    .hidden { display: none !important; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="redirect-box" id="mainBox">
    <h2 id="pageTitle">🌐 Get Your Link</h2>
    <p id="instructionText" class="instruction-text">Enter your Short Code below to fetch the original URL.</p>

    <div id="loaderContainer" class="loader-container">
      <div class="loader"></div>
      <div class="status-text" id="statusMessage">Searching Database...</div>
    </div>

    <input type="text" id="urlInputBox" class="search-box" placeholder="e.g. aB3xQ9" autocomplete="off">
    <button id="searchBtn" class="btn-primary">🔍 Search Link</button>

    <div id="actionButtons" class="action-buttons">
      <button id="copyBtn" class="btn-secondary">📋 Copy</button>
      <button id="openBtn" class="btn-secondary btn-open">🌐 Open Link</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvfmi1IB--svbmXitMHRMyrvnIPA28DW4",
      authDomain: "zonqr-db.firebaseapp.com",
      projectId: "zonqr-db",
      storageBucket: "zonqr-db.firebasestorage.app",
      messagingSenderId: "1038668023878",
      appId: "1:1038668023878:web:63c2af52ab655871c8a247",
      measurementId: "G-PRMV84KLX7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlInputBox = document.getElementById("urlInputBox");
    const searchBtn = document.getElementById("searchBtn");
    const actionButtons = document.getElementById("actionButtons");
    const copyBtn = document.getElementById("copyBtn");
    const openBtn = document.getElementById("openBtn");
    const loaderContainer = document.getElementById("loaderContainer");
    const instructionText = document.getElementById("instructionText");
    const pageTitle = document.getElementById("pageTitle");

    let finalOriginalUrl = "";

    async function triggerFetch(docID) {
      searchBtn.classList.add("hidden");
      instructionText.classList.add("hidden");
      loaderContainer.style.display = "block";
      urlInputBox.readOnly = true;

      try {
        const docSnap = await getDoc(doc(db, "urls", docID));
        if (docSnap.exists()) {
          finalOriginalUrl = docSnap.data().originalUrl;
          updateDoc(doc(db, "urls", docID), { clicks: increment(1) });
          loaderContainer.style.display = "none";
          pageTitle.innerText = "✅ Link Found!";
          urlInputBox.value = finalOriginalUrl;
          actionButtons.style.display = "flex";
        } else {
          alert("Link not found!");
          location.reload();
        }
      } catch (e) { alert("Error!"); location.reload(); }
    }

    searchBtn.addEventListener("click", () => {
      if (!urlInputBox.value.trim()) return alert("Enter Code!");
      triggerFetch(urlInputBox.value.trim());
    });

    // Copy Button with Smartlink Integration
    copyBtn.addEventListener("click", () => {
      // 1. Copy original URL to clipboard
      navigator.clipboard.writeText(finalOriginalUrl);
      copyBtn.innerText = "✅ Copied!";
      
      // 2. Open Smartlink in new tab
      window.open("https://balancedsuppercreed.com/i45vms09?key=78c856e6170a2fbba6022cec86b75a77", "_blank");
      
      setTimeout(() => { copyBtn.innerText = "📋 Copy"; }, 2000);
    });

    openBtn.addEventListener("click", () => { window.location.href = finalOriginalUrl; });
  </script>

  <script type='text/javascript' src='//balancedsuppercreed.com/14/bd/d9/14bdd96cc0568c80149e6ad07d83178a.js'></script>
</body>
</html>
