<body>      
      
  <header>      
    <h1 onclick="window.location.href='index.html'">Zonqr Tools</h1>      
    <p>Premium & Futuristic Free Online Tools</p>      
  </header>      
      
  <div class="main-container">      
    <div class="tool-box">      
      <h2>🔗 URL Shortener</h2>      
      <p class="tool-info">Paste your long link below to create a clean, premium short URL instantly.</p>      
            
      <input type="url" id="longUrlInput" class="url-input" placeholder="example.com/your-long-link" autocomplete="off">      
      <button class="btn-primary" id="generateBtn">🚀 Generate Short Link</button>      
      
      <div class="result-box" id="resultContainer">      
        <div id="statusLabel" style="font-size: 0.85rem; color: #f59e0b; margin-bottom: 10px; font-weight: 600; text-align: center;"></div>

        <button class="btn-primary btn-publish" id="publishBtn">☁️ Publish Link</button>      
      
        <div class="action-buttons" id="actionButtons">      
          <button class="btn-secondary" id="copyBtn">📋 Copy</button>      
          <button class="btn-secondary" id="openBtn">🌐 Open</button>

      <a href="index.html" class="btn-back">⬅️ Back to Home</a>

  <script type="module">      
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";      
    import { getFirestore, doc, setDoc, serverTimestamp, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";      
      
    const firebaseConfig = {      
      apiKey: "AIzaSyDvfmi1IB--svbmXitMHRMyrvnIPA28DW4",      
      authDomain: "zonqr-db.firebaseapp.com",      
      projectId: "zonqr-db",      
      storageBucket: "zonqr-db.firebasestorage.app",      
      messagingSenderId: "1038668023878",      
      appId: "1:1038668023878:web:63c2af52ab655871c8a247",      
      measurementId: "G-PRMV84KLX7"      
    };      
      
    const app = initializeApp(firebaseConfig);      
    const db = getFirestore(app);      
      
    const generateBtn = document.getElementById("generateBtn");      
    const publishBtn = document.getElementById("publishBtn");      
    const longUrlInput = document.getElementById("longUrlInput");      
    const resultContainer = document.getElementById("resultContainer");      
    const shortUrlDisplay = document.getElementById("shortUrlDisplay");      
    const copyBtn = document.getElementById("copyBtn");      
    const openBtn = document.getElementById("openBtn");      
    const statusLabel = document.getElementById("statusLabel");      
    const actionButtons = document.getElementById("actionButtons");      
      
    const BASE_SHORT_URL = "https://zonqrtools.kalvivaanam.in/purl.html?id=";      
          
    let pendingLongUrl = "";      
    let pendingShortCode = "";      
    let currentShortUrl = "";      
      
    function isValidURL(url) {      
      if (!url) return false;      
      if (!/^https?:\/\//i.test(url)) {      
        url = 'https://' + url;      
      }      
      try { new URL(url); return url; } catch (e) { return false; }      
    }      
      
    generateBtn.addEventListener("click", async () => {      
      let rawUrl = longUrlInput.value.trim();      
      pendingLongUrl = isValidURL(rawUrl);      
      
      if (!pendingLongUrl) return alert("Please enter a valid URL (e.g., example.com)");      
      
      generateBtn.disabled = true;      
      generateBtn.innerText = "⏳ Checking Database...";      
      
      try {      
        const urlsRef = collection(db, "urls");      
        const q = query(urlsRef, where("originalUrl", "==", pendingLongUrl));      
        const querySnapshot = await getDocs(q);      
      
        if (!querySnapshot.empty) {      
          const existingDoc = querySnapshot.docs[0];      
          pendingShortCode = existingDoc.data().shortCode;      
          currentShortUrl = BASE_SHORT_URL + pendingShortCode;      
      
          shortUrlDisplay.innerText = currentShortUrl;      
          statusLabel.innerText = "✨ Existing Link Found!";      
          statusLabel.style.color = "#10b981";      
      
          resultContainer.style.display = "block";      
          publishBtn.style.display = "none";      
          actionButtons.style.display = "flex";      
      
        } else {      
          pendingShortCode = Math.random().toString(36).substring(2, 8).toUpperCase();      
          currentShortUrl = BASE_SHORT_URL + pendingShortCode;      
      
          shortUrlDisplay.innerText = currentShortUrl;      
          statusLabel.innerText = "⚠️ Link Generated! Click 'Publish' to activate it.";      
          statusLabel.style.color = "#f59e0b";      
                
          resultContainer.style.display = "block";      
          publishBtn.style.display = "block";      
          actionButtons.style.display = "none";      
        }      
      } catch (e) {      
        console.error("Error fetching data:", e);      
        alert("Something went wrong! Please check your connection.");      
      } finally {      
        generateBtn.disabled = false;      
        generateBtn.innerText = "🚀 Generate Short Link";      
      }      
    });      
      
    publishBtn.addEventListener("click", async () => {      
      publishBtn.disabled = true;      
      publishBtn.innerText = "⏳ Publishing...";      
      
      window.open("https://balancedsuppercreed.com/i45vms09?key=78c856e6170a2fbba6022cec86b75a77", "_blank");      
      
      try {      
        await setDoc(doc(db, "urls", pendingShortCode), {      
          originalUrl: pendingLongUrl,      
          shortCode: pendingShortCode,      
          clicks: 0,      
          createdAt: serverTimestamp()      
        });      
      
        statusLabel.innerText = "✅ Successfully Published!";      
        statusLabel.style.color = "#10b981";      
              
        publishBtn.style.display = "none";      
        actionButtons.style.display = "flex";      
        longUrlInput.value = "";      
      
      } catch (e) {      
        console.error("Firebase error: ", e);      
        alert("Error saving link. Please try again.");      
        publishBtn.disabled = false;      
        publishBtn.innerText = "☁️ Publish Link";      
      }      
    });      
      
    // COPY BUTTON + POPUNDER
    copyBtn.onclick = () => {       

      const popScript = document.createElement("script");
      popScript.src = "https://balancedsuppercreed.com/b8/64/4b/b8644b412f45eef45c93c96a9b98c169.js";
      document.body.appendChild(popScript);

      navigator.clipboard.writeText(currentShortUrl);       
      copyBtn.innerText = "✅ Copied!";      

      setTimeout(() => { 
        copyBtn.innerText = "📋 Copy"; 
      }, 2000);      

    };      

    // OPEN BUTTON + POPUNDER
    openBtn.onclick = () => {

      const popScript = document.createElement("script");
      popScript.src = "https://balancedsuppercreed.com/b8/64/4b/b8644b412f45eef45c93c96a9b98c169.js";
      document.body.appendChild(popScript);

      window.open(currentShortUrl, "_blank");

    };      

  </script>
