<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>URL Shortener - Zonqr Tools</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a, #020617); color: white; text-align: center; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 40px 20px 20px; }
    .site-logo { max-width: 180px; height: auto; margin-bottom: 10px; cursor: pointer; }
    header h1 { font-size: 2.2rem; font-weight: 800; cursor: pointer; background: linear-gradient(to right, #a855f7, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { font-size: 1rem; font-weight: 600; color: #94a3b8; margin-top: 5px; }
    
    .main-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; flex: 1; width: 100%; }
    .tool-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(6, 182, 212, 0.2); width: 100%; max-width: 550px; margin: 20px auto; }
    .tool-box h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; }
    .tool-info { color: #94a3b8; font-size: 0.95rem; margin-bottom: 25px; }
    
    .url-input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 1rem; outline: none; margin-bottom: 20px; transition: all 0.3s; }
    .url-input:focus { border-color: #06b6d4; box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
    
    .btn-primary { background: linear-gradient(135deg, #a855f7, #06b6d4); color: white; border: none; padding: 16px 20px; font-weight: 800; border-radius: 12px; width: 100%; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
    
    .btn-publish { background: linear-gradient(135deg, #10b981, #059669); margin-bottom: 15px; display: none; }
    
    .result-box { margin-top: 30px; padding: 20px; background: rgba(15, 23, 42, 0.8); border-radius: 12px; border: 1px dashed #06b6d4; display: none; }
    .short-url { font-size: 1.1rem; font-weight: 800; color: #0ea5e9; margin-bottom: 20px; word-break: break-all; }
    .action-buttons { display: none; gap: 12px; }
    .btn-secondary { flex: 1; background: #1e293b; color: white; border: 1px solid #334155; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 600; }

    .ad-container { margin: 20px 0; display: flex; justify-content: center; }
  </style>
</head>
<body>

  <header>
    <h1 onclick="window.location.href='index.html'">Zonqr Tools</h1>
    <p>Premium & Futuristic Free Online Tools</p>
  </header>

  <div class="main-container">
    <div class="tool-box">
      <h2>🔗 URL Shortener</h2>
      <input type="url" id="longUrlInput" class="url-input" placeholder="example.com/your-long-link" autocomplete="off">
      <button class="btn-primary" id="generateBtn">🚀 Generate Short Link</button>

      <div class="result-box" id="resultContainer">
        <div id="statusLabel" style="font-size: 0.85rem; color: #f59e0b; margin-bottom: 10px; font-weight: 600;"></div>
        <div class="short-url" id="shortUrlDisplay"></div>
        <button class="btn-primary btn-publish" id="publishBtn">☁️ Publish Link</button>
        <div class="action-buttons" id="actionButtons">
          <button class="btn-secondary" id="copyBtn">📋 Copy</button>
          <button class="btn-secondary" id="openBtn">🌐 Open</button>
        </div>
      </div>
    </div>

    <!-- 300x250 Banner Ad -->
    <div class="ad-container">
      <script>
        atOptions = {'key' : '369d1a61b64dd3dec39f12e9944c804d', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {}};
      </script>
      <script src="https://balancedsuppercreed.com/369d1a61b64dd3dec39f12e9944c804d/invoke.js"></script>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const db = getFirestore(initializeApp({
      apiKey: "AIzaSyDvfmi1IB--svbmXitMHRMyrvnIPA28DW4",
      projectId: "zonqr-db",
      storageBucket: "zonqr-db.firebasestorage.app",
      messagingSenderId: "1038668023878",
      appId: "1:1038668023878:web:63c2af52ab655871c8a247"
    }));

    const generateBtn = document.getElementById("generateBtn");
    const publishBtn = document.getElementById("publishBtn");
    const longUrlInput = document.getElementById("longUrlInput");
    const resultContainer = document.getElementById("resultContainer");

    generateBtn.addEventListener("click", async () => {
      let rawUrl = longUrlInput.value.trim();
      if (!rawUrl) return alert("Enter URL!");
      
      generateBtn.disabled = true;
      generateBtn.innerText = "⏳ Checking...";

      const q = query(collection(db, "urls"), where("originalUrl", "==", rawUrl));
      const querySnapshot = await getDocs(q);

      if (!querySnapshot.empty) {
        document.getElementById("shortUrlDisplay").innerText = "https://zonqrtools.kalvivaanam.in/purl.html?id=" + querySnapshot.docs[0].data().shortCode;
        document.getElementById("actionButtons").style.display = "flex";
      } else {
        window.pendingShortCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        document.getElementById("shortUrlDisplay").innerText = "https://zonqrtools.kalvivaanam.in/purl.html?id=" + window.pendingShortCode;
        document.getElementById("publishBtn").style.display = "block";
      }
      resultContainer.style.display = "block";
      generateBtn.disabled = false;
      generateBtn.innerText = "🚀 Generate Short Link";
    });

    publishBtn.addEventListener("click", async () => {
      // Popunder Ad Trigger
      const script = document.createElement('script');
      script.src = "https://balancedsuppercreed.com/b8/64/4b/b8644b412f45eef45c93c96a9b98c169.js";
      document.body.appendChild(script);

      await setDoc(doc(db, "urls", window.pendingShortCode), {
        originalUrl: longUrlInput.value.trim(),
        shortCode: window.pendingShortCode,
        clicks: 0,
        createdAt: serverTimestamp()
      });
      publishBtn.style.display = "none";
      document.getElementById("actionButtons").style.display = "flex";
    });

    document.getElementById("copyBtn").onclick = () => navigator.clipboard.writeText(document.getElementById("shortUrlDisplay").innerText);
    document.getElementById("openBtn").onclick = () => window.open(document.getElementById("shortUrlDisplay").innerText, "_blank");
  </script>

  <script src="https://balancedsuppercreed.com/14/bd/d9/14bdd96cc0568c80149e6ad07d83178a.js"></script>
</body>
</html>
