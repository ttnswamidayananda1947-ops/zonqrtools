<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>URL Shortener - Zonqr Tools</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #0f172a, #020617); color: white; text-align: center; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 40px 20px 20px; }
    .site-logo { max-width: 180px; height: auto; margin-bottom: 10px; cursor: pointer; }
    header h1 { font-size: 2.2rem; font-weight: 800; cursor: pointer; background: linear-gradient(to right, #a855f7, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { font-size: 1rem; font-weight: 600; color: #94a3b8; margin-top: 5px; }
    .main-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; flex: 1; width: 100%; }
    .tool-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(6, 182, 212, 0.2); width: 100%; max-width: 550px; margin: 20px auto; }
    .url-input { width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; font-size: 1rem; outline: none; margin-bottom: 20px; }
    .btn-primary { background: linear-gradient(135deg, #a855f7, #06b6d4); color: white; border: none; padding: 16px 20px; font-weight: 800; border-radius: 12px; width: 100%; cursor: pointer; }
    .result-box { margin-top: 30px; padding: 20px; background: rgba(15, 23, 42, 0.8); border-radius: 12px; border: 1px dashed #06b6d4; text-align: left; display: none; }
    .short-url { font-size: 1.1rem; font-weight: 800; color: #0ea5e9; margin-bottom: 20px; word-break: break-all; }
    .action-buttons { display: flex; gap: 12px; }
    .btn-secondary { flex: 1; background: #1e293b; color: white; border: 1px solid #334155; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <header>
    <h1>Zonqr Tools</h1>
    <p>Premium & Futuristic Free Online Tools</p>
  </header>

  <div class="main-container">
    <div class="tool-box">
      <h2>🔗 URL Shortener</h2>
      <input type="url" id="longUrlInput" class="url-input" placeholder="Paste your long link here..." autocomplete="off">
      <button class="btn-primary" id="generateBtn">🚀 Generate Short Link</button>

      <div class="result-box" id="resultContainer">
        <div id="statusLabel" style="font-size: 0.8rem; color: #06b6d4; margin-bottom: 10px;"></div>
        <div class="short-url" id="shortUrlDisplay"></div>
        <div class="action-buttons">
          <button class="btn-secondary" id="copyBtn">📋 Copy</button>
          <button class="btn-secondary" id="openBtn">🌐 Open</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvfmi1IB--svbmXitMHRMyrvnIPA28DW4",
      authDomain: "zonqr-db.firebaseapp.com",
      projectId: "zonqr-db",
      storageBucket: "zonqr-db.firebasestorage.app",
      messagingSenderId: "1038668023878",
      appId: "1:1038668023878:web:63c2af52ab655871c8a247",
      measurementId: "G-PRMV84KLX7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const generateBtn = document.getElementById("generateBtn");
    const longUrlInput = document.getElementById("longUrlInput");
    const resultContainer = document.getElementById("resultContainer");
    const shortUrlDisplay = document.getElementById("shortUrlDisplay");
    const copyBtn = document.getElementById("copyBtn");
    const openBtn = document.getElementById("openBtn");
    const statusLabel = document.getElementById("statusLabel");

    const BASE_SHORT_URL = "https://zonqrtools.kalvivaanam.in/purl.html?id=";
    let currentShortUrl = "";

    generateBtn.addEventListener("click", async () => {
      let longUrl = longUrlInput.value.trim();
      if (!longUrl) return alert("Please enter a URL");

      generateBtn.disabled = true;
      generateBtn.innerText = "⏳ Processing...";

      try {
        const urlsRef = collection(db, "urls");
        const q = query(urlsRef, where("originalUrl", "==", longUrl));
        const snapshot = await getDocs(q);

        let shortCode = "";
        if (!snapshot.empty) {
          shortCode = snapshot.docs[0].data().shortCode;
          statusLabel.innerText = "✨ Existing Link Found!";
        } else {
          shortCode = Math.random().toString(36).substring(2, 8).toUpperCase();
          await setDoc(doc(db, "urls", shortCode), {
            originalUrl: longUrl,
            shortCode: shortCode,
            clicks: 0,
            createdAt: serverTimestamp()
          });
          statusLabel.innerText = "🚀 New Link Created!";
        }

        currentShortUrl = BASE_SHORT_URL + shortCode;
        shortUrlDisplay.innerText = currentShortUrl;
        resultContainer.style.display = "block";
      } catch (e) {
        alert("Error: " + e.message);
      } finally {
        generateBtn.disabled = false;
        generateBtn.innerText = "🚀 Generate Short Link";
      }
    });

    copyBtn.onclick = () => { navigator.clipboard.writeText(currentShortUrl); alert("Copied!"); };
    openBtn.onclick = () => window.open(currentShortUrl, "_blank");
  </script>
</body>
</html>
