<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Test - Zonqr Tools</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Poppins,sans-serif;
      background:linear-gradient(135deg,#0f172a,#020617);
      min-height:100vh;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      padding:20px;
      text-align:center;
    }

    .box{
      width:100%;
      max-width:700px;
      background:white;
      color:black;
      padding:30px 20px;
      border-radius:20px;
      box-shadow:0 0 40px rgba(0,255,255,0.25);
    }

    h1{
      font-size:2rem;
      margin-bottom:10px;
      font-weight:800;
      color:#0f172a;
    }

    p{
      color:#64748b;
      margin-bottom:25px;
      line-height:1.6;
    }

    .ad-box{
      margin:25px 0;
      padding:15px;
      border:2px dashed #cbd5e1;
      border-radius:15px;
      min-height:120px;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f8fafc;
    }

    .label{
      margin-bottom:10px;
      font-size:14px;
      color:#94a3b8;
      font-weight:600;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
</head>

<body>

  <div class="box">

    <h1>🔥 Banner Ads Test</h1>

    <p>
      Testing Monetag banner formats for clean user experience and safe ads.
    </p>

    <div class="label">
      In-Page Push Banner
    </div>

    <div class="ad-box">

      <script>
      (function(s){
        s.dataset.zone='11040951',
        s.src='https://nap5k.com/tag.min.js'
      })(
        [document.documentElement, document.body]
        .filter(Boolean)
        .pop()
        .appendChild(document.createElement('script'))
      )
      </script>

    </div>

    <div class="label">
      Vignette Banner
    </div>

    <div class="ad-box">

      <script>
      (function(s){
        s.dataset.zone='11040953',
        s.src='https://n6wxm.com/vignette.min.js'
      })(
        [document.documentElement, document.body]
        .filter(Boolean)
        .pop()
        .appendChild(document.createElement('script'))
      )
      </script>

    </div>

  </div>

</body>
</html>
