<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Link Test - Zonqr Tools</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Poppins,sans-serif;
      background:linear-gradient(135deg,#020617,#0f172a);
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .box{
      width:100%;
      max-width:500px;
      background:white;
      color:black;
      padding:35px 25px;
      border-radius:25px;
      text-align:center;
      box-shadow:0 0 40px rgba(0,255,255,0.25);
    }

    h1{
      font-size:2rem;
      margin-bottom:10px;
      color:#0f172a;
    }

    p{
      color:#64748b;
      line-height:1.7;
      margin-bottom:25px;
      font-size:1rem;
    }

    .btn{
      display:inline-block;
      background:linear-gradient(135deg,#06b6d4,#3b82f6);
      color:white;
      text-decoration:none;
      padding:15px 28px;
      border-radius:14px;
      font-size:1rem;
      font-weight:700;
      transition:0.2s;
      border:none;
      cursor:pointer;
    }

    .btn:active{
      transform:scale(0.96);
    }

    .note{
      margin-top:25px;
      font-size:0.85rem;
      color:#94a3b8;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>

  <div class="box">

    <h1>🔥 Smart Link Test</h1>

    <p>
      Testing Monetag Direct Smart Link Ad.<br>
      Click the button below to test ad quality and user experience.
    </p>

    <button class="btn" onclick="openAd()">
      Open Smart Link
    </button>

    <div class="note">
      Zonqr Tools • Clean UX Ad Testing
    </div>

  </div>

  <script>
    function openAd(){

      window.open(
        "https://omg10.com/4/11040998",
        "_blank"
      );

    }
  </script>

</body>
</html>
