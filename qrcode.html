function extractColors(grad) {
  return grad.match(/#[a-fA-F0-9]{6}/g) || ['#222222','#444444'];
}

function getMatrix(text) {
  return new Promise(function(resolve, reject) {
    const div = document.getElementById('qrHidden');
    div.innerHTML = '';
    let qr;
    try {
      qr = new QRCode(div, { text: text, width: 100, height: 100, correctLevel: QRCode.CorrectLevel.H });
    } catch(e) { return reject(e); }
    setTimeout(function() {
      try {
        const model = qr._oQRCode;
        const n = model.getModuleCount();
        const mat = [];
        for (let r = 0; r < n; r++) {
          mat[r] = [];
          for (let c = 0; c < n; c++) mat[r][c] = model.isDark(r, c);
        }
        resolve({ mat: mat, n: n });
      } catch(e) { reject(e); }
    }, 200);
  });
}

function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

function drawFinder(ctx, fx, fy, ms, dark, light) {
  var fw = 7 * ms;
  var cr = ms * 1.5;
  ctx.fillStyle = dark;
  rrect(ctx, fx, fy, fw, fw, cr);
  ctx.fill();
  ctx.fillStyle = light;
  rrect(ctx, fx + ms, fy + ms, 5*ms, 5*ms, cr * 0.5);
  ctx.fill();
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.arc(fx + 3.5*ms, fy + 3.5*ms, 1.5*ms, 0, Math.PI*2);
  ctx.fill();
}

function drawQRModules(ctx, mat, n, ox, oy, ms, dark, light) {
  ctx.fillStyle = dark;
  for (var r = 0; r < n; r++) {
    for (var c = 0; c < n; c++) {
      if (!mat[r][c]) continue;
      if (r < 8 && c < 8)       continue;
      if (r < 8 && c >= n-8)    continue;
      if (r >= n-8 && c < 8)    continue;
      ctx.beginPath();
      ctx.arc(ox + c*ms + ms/2, oy + r*ms + ms/2, ms*0.44, 0, Math.PI*2);
      ctx.fill();
    }
  }
  drawFinder(ctx, ox,              oy,              ms, dark, light);
  drawFinder(ctx, ox + (n-7)*ms,   oy,              ms, dark, light);
  drawFinder(ctx, ox,              oy + (n-7)*ms,   ms, dark, light);
}

function drawWatermark(ctx, cx, y, onDark) {
  var line1 = 'did you want to create like this QR go to';
  var line2 = 'https://zonqrtools.kalvivaanam.in/qrcode.html';
  ctx.textAlign = 'center';
  if (onDark) {
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.font = '500 11px Poppins, Arial, sans-serif';
    ctx.fillText(line1, cx, y);
    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.font = '800 11px Poppins, Arial, sans-serif';
    ctx.fillText(line2, cx, y + 21);
  } else {
    ctx.fillStyle = '#64748b';
    ctx.font = '500 11px Poppins, Arial, sans-serif';
    ctx.fillText(line1, cx, y);
    ctx.fillStyle = '#2563eb';
    ctx.font = '700 11px Poppins, Arial, sans-serif';
    ctx.fillText(line2, cx, y + 21);
  }
}

async function generate(type) {
  var isBasic = (type === 'basic');
  var inputId = isBasic ? 'basicInput' : 'premiumInput';
  var text = document.getElementById(inputId).value.trim();
  if (!text) { alert('Please enter a URL or text'); return; }

  var btnId = isBasic ? 'btnBasic' : 'btnPremium';
  var btn = document.getElementById(btnId);
  var origText = btn.textContent;
  btn.classList.add('loading');
  btn.textContent = 'Generating…';

  try {
    var result = await getMatrix(text);
    var mat = result.mat, n = result.n;

    var canvasId  = isBasic ? 'basicCanvas'  : 'premiumCanvas';
    var outputId  = isBasic ? 'basicOutput'  : 'premiumOutput';
    var dlId      = isBasic ? 'dlBasic'      : 'dlPremium';
    var dlName    = isBasic ? 'QR_Basic'     : 'QR_Premium';

    var canvas = document.getElementById(canvasId);
    var ctx    = canvas.getContext('2d');

    if (isBasic) {
      var W = 500, QPAD = 24, WMARK = 56, H = W + WMARK;
      canvas.width = W; canvas.height = H;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      var qrArea = W - QPAD*2;
      var ms = qrArea / n;
      drawQRModules(ctx, mat, n, QPAD, QPAD, ms, '#0f172a', '#ffffff');
      drawWatermark(ctx, W/2, W + 13, false);

    } else {
      var W = 540, QPAD = 26, IPAD = 26, WMARK = 60, H = W + WMARK;
      canvas.width = W; canvas.height = H;

      var colors = extractColors(selectedGrad);
      var grd = ctx.createLinearGradient(0, 0, W, H);
      colors.forEach(function(c, i) {
        grd.addColorStop(i / Math.max(colors.length - 1, 1), c);
      });
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);

      var boxW = W - QPAD*2, boxH = boxW;
      ctx.fillStyle = 'rgba(255,255,255,0.96)';
      rrect(ctx, QPAD, QPAD, boxW, boxH, 22);
      ctx.fill();

      var qrArea = boxW - IPAD*2;
      var ms = qrArea / n;
      var ox = QPAD + IPAD, oy = QPAD + IPAD;
      drawQRModules(ctx, mat, n, ox, oy, ms, '#1a0533', '#ffffff');

      if (logoData) {
        await new Promise(function(resolve) {
          var img = new Image();
          img.onload = function() {
            var cx = ox + qrArea/2, cy = oy + qrArea/2;
            var ls = qrArea * 0.165, lp = 7;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, cy, ls/2 + lp, 0, Math.PI*2);
            ctx.fill();
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, ls/2, 0, Math.PI*2);
            ctx.clip();
            ctx.drawImage(img, cx - ls/2, cy - ls/2, ls, ls);
            ctx.restore();
            resolve();
          };
          img.onerror = resolve;
          img.src = logoData;
        });
      }
      drawWatermark(ctx, W/2, W + 13, true);
    }

    document.getElementById(outputId).classList.add('show');
    var dl = document.getElementById(dlId);
    dl.href = canvas.toDataURL('image/png', 1.0);
    dl.download = dlName + '_' + Date.now() + '.png';
    
    // Attach ad trigger logic to download button
    dl.onclick = triggerAdsterraAds;

  } catch(err) {
    alert('QR generation failed. Please try again.\n' + (err.message || err));
  } finally {
    btn.classList.remove('loading');
    btn.textContent = origText;
  }
}
</script>
